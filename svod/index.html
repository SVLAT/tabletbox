<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Расходы, задачи и быстрые голосовые записи в одном личном планере."><title>Свод — личный планер</title><link rel="icon" href="mark.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="voice.js" defer></script><script src="account.js" defer></script><script async id="identitySDK" src="https://js.puter.com/v2/"></script><script src="app.js" defer></script></head><body>
<main class="shell"><header class="brandbar"><div class="brand"><img src="mark.svg" alt="" width="31" height="31">Свод</div><button id="mode" class="pill" hidden>Мой аккаунт</button></header>
<section class="welcome card" id="welcome" aria-labelledby="welcomeTitle">
<div class="welcome-mark" aria-hidden="true"><img src="mark.svg" alt="" width="50" height="50"></div>
<h1 id="welcomeTitle">Твой личный свод</h1>
<p>Расходы и задачи в одном месте. Войди, чтобы открыть свои записи на любом устройстве.</p>
<div class="welcome-actions"><button id="enter" class="primary wide">Войти или зарегистрироваться</button>
<button id="cancelEnter" class="secondary wide" hidden>Отменить вход</button>
<button id="tryDemo" class="secondary wide">Посмотреть демо</button></div>
<p id="authStatus" class="quiet" role="status" aria-live="polite">Вход через Puter</p>
</section>
<div id="workspace" hidden><div class="datehead"><div><h1 id="heading">Сегодня</h1><p id="dateLabel"></p></div><button class="square" id="calendar" aria-label="Выбрать дату" data-icon="calendar"></button></div>
<div id="dashboard"><button id="hero" class="card hero" aria-label="Открыть историю расходов и выбрать месяц"><span class="topline"><strong>Расходы</strong><span data-icon="chevron"></span></span><span class="month" id="monthLabel"></span><span class="heroTotal"><b id="total"></b><span>AED</span></span></button>
<section class="card cats"><h2>По категориям</h2><div class="breakdown"><div class="ring" id="ring"></div><div id="legend"></div></div></section>
<div class="quick"><button id="addExpense" class="card action"><span class="iconbox" data-icon="plus"></span><strong>Добавить расход</strong></button><button id="voice" class="card action voice"><span class="iconbox" data-icon="mic"></span><strong>Голосовая запись</strong></button></div>
<section class="card tasks"><div class="topline"><h2>Задачи</h2><button id="addTask" class="iconbtn" aria-label="Добавить задачу" data-icon="plus"></button></div><div id="taskList"></div></section></div></div>
</main><dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheethead"><h2 id="sheetTitle"></h2><button id="close" class="iconbtn" aria-label="Закрыть" data-icon="close"></button></div><div id="sheetBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
